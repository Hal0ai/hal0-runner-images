name: Fork watch

# Weekly: compare every pinned runner source (runners/*/manifest.toml,
# build-recipes.json) against the branch it tracks, and keep ONE open
# tracking issue up to date with the result. Builds nothing, pushes
# nothing: a person decides which bumps are worth a build
# (docs/BUMPING.md). On a pull request that touches the watch itself it
# runs report-only (job summary, no issue write) so the change is exercised
# before merge.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/fork_watch.py
      - .github/workflows/fork-watch.yml

concurrency:
  group: fork-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Compare pins with tracked branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fork_watch.py > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update the tracking issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Fork watch: pinned runner sources"
        run: |
          set -euo pipefail
          {
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "_Updated $(date -u +%Y-%m-%dT%H:%MZ) by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > "$RUNNER_TEMP/body.md"
          num="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
                   --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [[ -n "$num" ]]; then
            gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

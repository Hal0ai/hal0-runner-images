name: Promote runner image

# Moves GATED digests into the two places that consume pins (docs/UPDATING.md,
# step 5). Run it by hand after the hardware gate passes:
#
#   promotions    what to pin, comma separated:
#                   standard=sha256:<digest>          a runner built here
#                   cuda=<tag>@sha256:<digest>        an external runner (no recipe here)
#                 A llama.cpp bump is ONE run for the group:
#                   standard=sha256:..,cpu=sha256:..,cuda=server-cuda-b11541@sha256:..
#                 (ggml-org skips releases: cuda takes the newest server-cuda-b<M>, M <= N)
#   gate_reports  one https URL covering every runner, or key=URL for each
#                 (JSON, schema hal0.gate-report.v1; a group document is fine).
#                 An external runner (cuda) has no hardware gate and may be left out.
#
# It verifies every item, then opens TWO pull requests and merges neither:
#   1. this repo:  images.json  each runner's tag + digest (candidate cleared),
#                  gate_report and lanes_gated (from the gate report)
#   2. Hal0ai/hal0: those runners' rows in the pin table of manifest.json (and
#                  only that file)
# If any item fails verification nothing is opened. standard and cpu must name
# one llama.cpp release, and cuda may not be ahead of it.
#
# Verification (ci/promote.py verify): the digest exists in
# ghcr.io/hal0ai/hal0-runner-<runner>; its signed provenance says it was built by
# .github/workflows/build.yml on refs/heads/main of this repository; its
# immutable tag still points at that digest; and a gate report names the same
# digest and passed. An external runner (cuda) is checked against the registry
# only: no provenance.
#
# SECRETS
#   HAL0_MANIFEST_PR_TOKEN   (already exists, used by the old pin-digests
#                             workflow) fine-grained PAT with Contents + Pull
#                             requests: write on Hal0ai/hal0. Required.
#   RUNNER_IMAGES_PR_TOKEN   fine-grained PAT with Contents + Pull requests:
#                             write on THIS repository (release-watch.yml
#                             also needs Issues: write on the same secret). REQUIRED for the bot to
#                             open the images.json PR: the Hal0ai org policy
#                             forbids pull requests created by GitHub Actions
#                             ("GitHub Actions is not permitted to create or
#                             approve pull requests"), and the default token is
#                             Actions. It also makes that PR get a CI run.
#                             Without it the run still pushes the branch,
#                             warns with the exact compare URL and title, and
#                             writes both to the job summary: a person opens
#                             the PR from the pushed branch.
#
# A pull request that cannot be opened never fails the job and never skips the
# hal0 step. Each branch push is reported; the job fails only when no branch was
# pushed and at least one push failed.

on:
  workflow_dispatch:
    inputs:
      promotions:
        description: "key=sha256:<digest>, comma separated; external runners as key=<tag>@sha256:<digest>"
        type: string
        required: true
      gate_reports:
        description: "https URL of one gate report covering all runners, or key=URL for each"
        type: string
        required: true
      create_missing_hal0_row:
        description: "Add a runner's row to hal0's pin table if it has none (normally hal0 adds rows first)"
        type: boolean
        default: false

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      packages: read
      attestations: read
    env:
      PROMOTIONS: ${{ inputs.promotions }}
      GATE_REPORTS: ${{ inputs.gate_reports }}
      THIS_TOKEN: ${{ secrets.RUNNER_IMAGES_PR_TOKEN || github.token }}
      HAL0_TOKEN: ${{ secrets.HAL0_MANIFEST_PR_TOKEN }}
    steps:
      - name: Require the cross-repo token before doing anything
        run: |
          if [[ -z "$HAL0_TOKEN" ]]; then
            echo "::error::secret HAL0_MANIFEST_PR_TOKEN is not set; promote would update only half of the pins."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RUNNER_IMAGES_PR_TOKEN || github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify every digest and gate report
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ci/promote.py verify --promotions "$PROMOTIONS" \
            --gate-reports "$GATE_REPORTS" --token "$GH_TOKEN" --out "$RUNNER_TEMP/result.json"
          python3 ci/promote.py pr-body --result "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/pr.md"

      - name: Push the images.json branch and open its pull request (this repository)
        id: images
        env:
          GH_TOKEN: ${{ env.THIS_TOKEN }}
          BRANCH: ${{ steps.verify.outputs.branch }}
          TITLE: ${{ steps.verify.outputs.title }}
        run: |
          set -euo pipefail
          python3 ci/promote.py catalogue --result "$RUNNER_TEMP/result.json"
          if git diff --quiet; then
            echo "images.json already has these pins; nothing to do"
            echo "result=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only)"
          [[ "$changed" == "images.json" ]] || { echo "::error::unexpected files changed: $changed"; exit 1; }
          git config user.name  "hal0-runner-images-bot"
          git config user.email "bot@hal0.local"
          git checkout -b "$BRANCH"
          git add images.json
          git commit -s -m "$TITLE"
          if ! git push --force origin "$BRANCH"; then
            echo "::error::could not push $BRANCH to $GITHUB_REPOSITORY; the hal0 pin step still runs"
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=pushed" >> "$GITHUB_OUTPUT"
          ci/open-pr.sh "$GITHUB_REPOSITORY" "$BRANCH" "$TITLE" "$RUNNER_TEMP/pr.md"

      - name: Check out Hal0ai/hal0
        uses: actions/checkout@v6
        with:
          repository: Hal0ai/hal0
          path: app
          token: ${{ secrets.HAL0_MANIFEST_PR_TOKEN }}

      - name: Push the pin branch and open its pull request (Hal0ai/hal0)
        id: hal0
        working-directory: app
        env:
          GH_TOKEN: ${{ env.HAL0_TOKEN }}
          BRANCH: ${{ steps.verify.outputs.branch }}
          TITLE: ${{ steps.verify.outputs.title }}
          CREATE_MISSING: ${{ inputs.create_missing_hal0_row }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$CREATE_MISSING" == "true" ]]; then extra=(--create-missing); fi
          python3 ../ci/promote.py hal0-pin --result "$RUNNER_TEMP/result.json" --hal0-dir . "${extra[@]}"
          if git diff --quiet; then
            echo "hal0 already has these pins; nothing to do"
            echo "result=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Regenerate hal0's derived pins export with hal0's own script, then
          # allow exactly the pin file and that export to change.
          read -r pin_file export_file < <(python3 -c 'import sys; sys.path.insert(0, "../ci"); import hal0_pins as h; print(h.HAL0_PIN_FILE, h.HAL0_EXPORT_FILE)')
          export_cmd="$(python3 -c 'import shlex, sys; sys.path.insert(0, "../ci"); import hal0_pins as h; print(shlex.join(h.HAL0_EXPORT_CMD))')"
          eval "$export_cmd" > "$export_file.tmp"
          mv "$export_file.tmp" "$export_file"
          changed="$(git diff --name-only | sort)"
          allowed="$(printf '%s\n' "$pin_file" "$export_file" | sort)"
          extra_files="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed"))"
          [[ -z "$extra_files" ]] || { echo "::error::unexpected files changed in hal0: $extra_files"; exit 1; }
          grep -qxF "$pin_file" <<<"$changed" || { echo "::error::$pin_file did not change but $changed did"; exit 1; }
          git config user.name  "hal0-runner-images-bot"
          git config user.email "bot@hal0.local"
          git checkout -b "$BRANCH"
          git add "$pin_file" "$export_file"
          git commit -s -m "$TITLE"
          if ! git push --force origin "$BRANCH"; then
            echo "::error::could not push $BRANCH to Hal0ai/hal0"
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=pushed" >> "$GITHUB_OUTPUT"
          ../ci/open-pr.sh Hal0ai/hal0 "$BRANCH" "$TITLE" "$RUNNER_TEMP/pr.md"

      - name: Report the outcome
        env:
          IMAGES: ${{ steps.images.outputs.result }}
          HAL0: ${{ steps.hal0.outputs.result }}
        run: |
          set -euo pipefail
          echo "images.json branch: ${IMAGES:-unknown}; hal0 pin branch: ${HAL0:-unknown}"
          {
            echo "### Promote result"
            echo
            echo "- images.json (this repository): ${IMAGES:-unknown}"
            echo "- pin table (Hal0ai/hal0): ${HAL0:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
          # Fail only when nothing was pushed and a push failed. A pull request
          # that could not be opened is a warning (see ci/open-pr.sh), not a failure.
          if [[ "$IMAGES" != "pushed" && "$HAL0" != "pushed" ]] && [[ "$IMAGES" == "failed" || "$HAL0" == "failed" ]]; then
            echo "::error::neither branch was pushed; nothing was promoted"
            exit 1
          fi

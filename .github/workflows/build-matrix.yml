name: Build runner images

# Build + push the publish:ci hal0 runner images to ghcr.io/hal0ai/.
# BUILD ONLY — pinning the app manifest is a separate, build-free workflow
# (pin-digests.yml). Referenced/external images are built elsewhere and are
# never built here; pin-digests.yml still pins their published digests.
#
# Migrated from the app repo's .github/workflows/toolbox.yml (which only built
# qwen3tts). Model: one matrix leg per image with publish=="ci" in images.json
# (today only comfyui; future new owned images e.g. vibevoice). linux/amd64;
# GitHub-hosted runner is fine (build only pulls base layers + pip/dnf).
# publish=="external"/"manual" images are NEVER built here — only their
# published digests are pinned by scripts/emit-manifest.sh.
#
# DISPATCH-ONLY by design. There is NO push/PR auto-trigger: a metadata edit
# (images.json, a doc) must not rebuild + re-push every runner image, and most
# owned images (kokoro/moonshine/qwen3tts/flm/cpu) are already published from
# other lineages — re-pushing them from here 403s (their org packages aren't
# writable by this repo) and would churn their digests. Build deliberately, one
# or a few images at a time, via `only`. Referenced images (vulkan/rocm/rocmfpx)
# build in their own repos.
#
# CONSOLIDATION (docs/CONSOLIDATION.md): build-recipes.json adds two
# non-catalogue targets moved from Hal0ai/amd-strix-halo-toolboxes,
# `strix-base` and `llama-vulkan`. They build ONLY when named in `only` (a
# blank `only` never selects them: they are long ROCm/Vulkan builds), push to
# NEW hal0-* packages, and push ONE immutable tag
# `<tag_prefix>-<llama_ref[:7]>-r<commit[:7]>`; the leg fails before building
# if that tag already exists, and never pushes a floating tag. The fork's
# ghcr.io/hal0ai/amd-strix-halo-toolboxes package is never a push target.
# `recipes_check` runs runners/*/build.sh --check (patch series applies, no
# container build).
#
# RUNNERS (docs/BUMPING.md): `only=runners/<dir>` builds that recipe with its
# own build.sh on a GitHub-hosted runner and pushes ONE immutable tag
# `<dir>-<source.ref[:7]>-r<commit[:7]>` to the recipe's [ci].image (a NEW
# ghcr.io/hal0ai/hal0-runner-* package, never the consumed one). With
# push=true it also keeps a GHCR copy of the pinned source (git bundle) and,
# for promptforge, of the sha256-pinned TheRock tarball, so a deleted fork or
# an expired AMD nightly cannot strand a pin. Nothing consumes a CI build
# until a planned bump re-runs the hardware gate.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated keys: images.json publish:ci ids, build-recipes.json ids (strix-base, llama-vulkan) and/or runners/<dir> (runners/rocmfpx, runners/upstream, runners/strix, runners/promptforge). Blank = all publish:ci images only."
        type: string
        default: "comfyui"
      push:
        description: "Push to ghcr.io (true) or build-only dry-run (false)"
        type: boolean
        default: true
      recipes_check:
        description: "Also run runners/*/build.sh --check (source ref reachable + patch series applies; builds nothing)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Derive the build matrix from images.json (owned images only), honouring
  # the optional workflow_dispatch `only` filter.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_images: ${{ steps.set.outputs.has_images }}
      recipes_matrix: ${{ steps.set.outputs.recipes_matrix }}
      has_recipes: ${{ steps.set.outputs.has_recipes }}
      runners_matrix: ${{ steps.set.outputs.runners_matrix }}
      has_runners: ${{ steps.set.outputs.has_runners }}
    steps:
      - uses: actions/checkout@v6
      - id: set
        shell: bash
        run: |
          python3 - "${{ github.event.inputs.only }}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, tomllib
          only = {s.strip() for s in (sys.argv[1] or "").split(",") if s.strip()}
          doc = json.load(open("images.json"))
          legs = []
          for e in doc["images"]:
              key = e["id"]
              # Build ONLY images this repo is the publisher of. 'external'
              # (archived-here-published-elsewhere) and 'manual' (referenced)
              # must not rebuild/repush — they'd 403 on pre-existing org
              # packages and/or overwrite the canonical artifact. Their digests
              # are still pinned by emit-manifest.sh. See images.json _comment.
              if e.get("publish") != "ci":
                  continue
              if only and key not in only:
                  continue
              b = e["build"]
              legs.append({
                  "key": key,
                  "image": e["image"],
                  "tag": e["tag"],
                  "context": b["context"],
                  "dockerfile": b["dockerfile"],
                  "build_args_from": b.get("build_args_from", ""),
              })
          print("matrix=" + json.dumps({"include": legs}))
          print("has_images=" + ("true" if legs else "false"))
          # Non-catalogue build targets (build-recipes.json). Selected ONLY
          # by explicit id in `only`, never by a blank `only`.
          recipes = json.load(open("build-recipes.json"))["recipes"]
          rlegs = []
          for r in recipes:
              if r["id"] not in only:
                  continue
              if not r["image"].startswith("ghcr.io/hal0ai/hal0-"):
                  sys.exit(f"{r['id']}: refusing non hal0-* push target {r['image']}")
              rlegs.append({k: r[k] for k in ("id", "image", "tag_prefix", "context", "dockerfile", "llama_ref")})
          print("recipes_matrix=" + json.dumps({"include": rlegs}))
          print("has_recipes=" + ("true" if rlegs else "false"))
          # runners/<dir> recipes. Selected ONLY by explicit key.
          runner_dirs = ("rocmfpx", "upstream", "strix", "promptforge")
          ulegs = []
          for d in runner_dirs:
              if f"runners/{d}" not in only:
                  continue
              m = tomllib.load(open(f"runners/{d}/manifest.toml", "rb"))
              img = m["ci"]["image"]
              if not img.startswith("ghcr.io/hal0ai/hal0-runner-"):
                  sys.exit(f"runners/{d}: refusing non hal0-runner-* push target {img}")
              ulegs.append({"dir": d, "image": img, "ref": m["source"]["ref"],
                            "therock": "true" if "therock" in m["base"] else "false"})
          print("runners_matrix=" + json.dumps({"include": ulegs}))
          print("has_runners=" + ("true" if ulegs else "false"))
          known = ({e["id"] for e in doc["images"] if e.get("publish") == "ci"} | {r["id"] for r in recipes}
                   | {f"runners/{d}" for d in runner_dirs})
          unknown = only - known
          if unknown:
              sys.exit(f"unknown or non-buildable key(s) in `only`: {sorted(unknown)}")
          PY

  build:
    needs: plan
    if: needs.plan.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Load versions.env (comfyui) into build-args if the leg declares one.
      - name: Assemble build args
        id: args
        shell: bash
        run: |
          args=""
          if [[ -n "${{ matrix.build_args_from }}" && -f "${{ matrix.build_args_from }}" ]]; then
            while IFS= read -r line; do
              [[ "$line" =~ ^[[:space:]]*# ]] && continue
              [[ -z "${line// }" ]] && continue
              kv="${line%%#*}"; kv="${kv//[[:space:]]/}"
              [[ "$kv" == *=* ]] && args+="${kv}"$'\n'
            done < "${{ matrix.build_args_from }}"
          fi
          {
            echo "build_args<<EOF"
            printf '%s' "$args"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.tag }},enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.key }}
            org.opencontainers.image.source=https://github.com/Hal0ai/hal0-runner-images

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push == true) }}
          build-args: ${{ steps.args.outputs.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.key }}
          cache-to: type=gha,mode=max,scope=${{ matrix.key }}
          platforms: linux/amd64
          provenance: false

      - name: Report digest
        if: steps.build.outputs.digest != ''
        run: |
          echo "Pushed ${{ matrix.image }}:${{ matrix.tag }}"
          echo "Digest ${{ steps.build.outputs.digest }}"
          echo "To pin it into the app manifest, run the 'Pin runner image digests' workflow."

  # build-recipes.json targets (strix-base, llama-vulkan). Immutable tag only;
  # refuses to overwrite. See the header note.
  build-recipe:
    needs: plan
    if: needs.plan.outputs.has_recipes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.recipes_matrix) }}
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - uses: actions/checkout@v6

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Compute immutable tag and refuse to overwrite
        id: tag
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          PREFIX: ${{ matrix.tag_prefix }}
          LLAMA_REF: ${{ matrix.llama_ref }}
        run: |
          set -euo pipefail
          tag="${PREFIX}-${LLAMA_REF:0:7}-r${GITHUB_SHA:0:7}"
          ref="${IMAGE}:${tag}"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "::error::${ref} already exists; tags from this workflow are immutable. Commit a recipe change (new r<sha>) to build again."
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Will build ${ref}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ inputs.push == true }}
          build-args: |
            LLAMA_REF=${{ matrix.llama_ref }}
          tags: ${{ steps.tag.outputs.ref }}
          labels: |
            org.opencontainers.image.title=${{ matrix.id }}
            org.opencontainers.image.source=https://github.com/Hal0ai/hal0-runner-images
            org.opencontainers.image.revision=${{ github.sha }}
            dev.hal0.llama.ref=${{ matrix.llama_ref }}
          platforms: linux/amd64
          provenance: false

      - name: Report digest
        if: steps.build.outputs.digest != ''
        run: |
          echo "Built ${{ steps.tag.outputs.ref }}"
          echo "Digest ${{ steps.build.outputs.digest }}"
          echo "Nothing consumes this yet: adopt it only through a planned bump with a hardware gate."

  # runners/<dir>: the recipe's own build.sh, then push under an immutable
  # tag. See the header note and docs/BUMPING.md.
  build-runner:
    needs: plan
    if: needs.plan.outputs.has_runners == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.runners_matrix) }}
    env:
      SOURCE_MIRROR: ghcr.io/hal0ai/hal0-source-mirror
      THEROCK_MIRROR: ghcr.io/hal0ai/hal0-therock-mirror
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker system prune --all --force
          df -h /

      - uses: actions/checkout@v6

      # Job-level env cannot read the runner context, so the scratch dir
      # build.sh uses ($WORK) is exported here.
      - name: Set build dir
        run: echo "HAL0_RUNNER_BUILD_DIR=${RUNNER_TEMP}/runner-${{ matrix.dir }}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oras-project/setup-oras@v1

      - name: Compute immutable tag and refuse to overwrite
        id: tag
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DIR: ${{ matrix.dir }}
          REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          tag="${DIR}-${REF:0:7}-r${GITHUB_SHA:0:7}"
          ref="${IMAGE}:${tag}"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "::error::${ref} already exists; tags from this workflow are immutable. Commit a recipe change (new r<sha>) to build again."
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Will build ${ref}"

      # promptforge only: reuse the mirrored TheRock tarball when one exists.
      # build.sh verifies the manifest sha256 either way, so a bad mirror
      # fails the build rather than reaching the image.
      - name: Restore TheRock tarball from the mirror
        if: matrix.therock == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ver="$(python3 -c 'import sys,tomllib;print(tomllib.load(open(sys.argv[1],"rb"))["base"]["rocm_version"])' "runners/${{ matrix.dir }}/manifest.toml")"
          mkdir -p "$HAL0_RUNNER_BUILD_DIR"
          if oras pull "${THEROCK_MIRROR}:${ver}" -o "$HAL0_RUNNER_BUILD_DIR"; then
            echo "restored TheRock ${ver} from ${THEROCK_MIRROR}"
          else
            echo "no mirror copy of TheRock ${ver} yet; build.sh fetches it from AMD"
          fi

      # A hosted runner has 4 vCPUs and 16 GB. One hipcc job can take 3-4 GB,
      # and with JOBS=nproc plus the Vulkan shader generator the rocmfpx build
      # ran out of memory ("Cannot allocate memory" / glslc "Failed to fork
      # process"). Add swap and run half as many jobs. Swap alone did not
      # fix it: fork() of the large vulkan-shaders-gen process was refused
      # under the default overcommit heuristic with 15 GB of swap still
      # free, so allow overcommit for the build (CI runner only).
      - name: Add swap and allow overcommit
        run: |
          sudo sysctl -w vm.overcommit_memory=1
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/hal0-swap
          sudo chmod 600 /mnt/hal0-swap
          sudo mkswap /mnt/hal0-swap
          sudo swapon /mnt/hal0-swap
          free -h

      - name: build.sh
        run: |
          jobs=$(( $(nproc) / 2 )); (( jobs >= 1 )) || jobs=1
          JOBS="$jobs" bash runners/${{ matrix.dir }}/build.sh --tag "${{ steps.tag.outputs.ref }}"

      - name: Push
        if: inputs.push == true
        run: |
          docker push "${{ steps.tag.outputs.ref }}"
          echo "Pushed ${{ steps.tag.outputs.ref }}"
          echo "Digest $(docker image inspect --format '{{index .RepoDigests 0}}' "${{ steps.tag.outputs.ref }}")"
          echo "Nothing consumes this yet: adopt it only through a planned bump with a hardware gate."

      # A GHCR copy of the pinned source, so the pin survives the fork being
      # deleted or force-pushed. One bundle per (recipe, source.ref).
      - name: Mirror the pinned source
        if: inputs.push == true
        shell: bash
        env:
          DIR: ${{ matrix.dir }}
          REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          dest="${SOURCE_MIRROR}:${DIR}-${REF}"
          if oras manifest fetch "$dest" >/dev/null 2>&1; then
            echo "source already mirrored at ${dest}"; exit 0
          fi
          repo="$(python3 -c 'import sys,tomllib;print(tomllib.load(open(sys.argv[1],"rb"))["source"]["repo"])' "runners/${DIR}/manifest.toml")"
          src="$HAL0_RUNNER_BUILD_DIR/src"
          git -C "$src" branch -f hal0-pin "$REF"
          git -C "$src" bundle create "$RUNNER_TEMP/source.bundle" hal0-pin
          git -C "$src" bundle verify "$RUNNER_TEMP/source.bundle"
          (cd "$RUNNER_TEMP" && oras push "$dest" \
            --annotation "org.opencontainers.image.source=${repo}" \
            --annotation "org.opencontainers.image.revision=${REF}" \
            source.bundle:application/x-git-bundle)
          echo "mirrored source to ${dest}"

      - name: Mirror the TheRock tarball
        if: inputs.push == true && matrix.therock == 'true'
        shell: bash
        run: |
          set -euo pipefail
          read -r ver url <<<"$(python3 -c 'import sys,tomllib;b=tomllib.load(open(sys.argv[1],"rb"))["base"];print(b["rocm_version"], b["therock"]["url"])' "runners/${{ matrix.dir }}/manifest.toml")"
          dest="${THEROCK_MIRROR}:${ver}"
          if oras manifest fetch "$dest" >/dev/null 2>&1; then
            echo "TheRock ${ver} already mirrored"; exit 0
          fi
          name="$(basename "$url")"
          (cd "$HAL0_RUNNER_BUILD_DIR" && oras push "$dest" "${name}:application/gzip")
          echo "mirrored TheRock ${ver} to ${dest}"

  # runners/*/build.sh --check: source ref reachable + patch series applies.
  # No container runtime, no push.
  runner-recipes-check:
    if: inputs.recipes_check == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        recipe: [rocmfpx, upstream, strix, promptforge]
    steps:
      - uses: actions/checkout@v6
      - name: build.sh --check
        env:
          HAL0_RUNNER_BUILD_DIR: ${{ runner.temp }}/runner-${{ matrix.recipe }}
        run: bash runners/${{ matrix.recipe }}/build.sh --check

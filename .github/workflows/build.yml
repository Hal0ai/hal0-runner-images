name: Build runner images

# Builds the runners whose files changed (runners/<key>/**). See docs/UPDATING.md.
#
#   pull request   `scripts/runner.py build <key> --check`, then a push=false
#                  image build of each changed runner. Broken bump = red PR.
#   merge to main  the same, then push ghcr.io/hal0ai/hal0-runner-<key>:<version>-r<sha7>
#                  (the tag scripts/runner.py computes), attest build
#                  provenance, and record tag + digest as a CANDIDATE
#                  (artifact, job summary, commit comment). A tag that already
#                  exists means that recipe was already built: the leg is
#                  skipped, never overwritten.
#   dispatch       runners=<keys|all>; pushes only when run on main and push=true.
#
# A build never changes what hal0 pulls. There are no moving tags, and
# images.json / hal0's pins move only through promote.yml after the hardware
# gate. scripts/runner.py (recipes side) is the only thing that knows how to
# build a runner; this file only runs it.
#
# There is no `paths:` filter on the trigger on purpose: a skipped or path-
# filtered workflow leaves a required status check pending forever. The plan
# job selects the runners and the "result" job is the single check to require.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runners:
        description: "Comma-separated runner keys, or 'all'"
        type: string
        required: true
      push:
        description: "Push to ghcr.io (only honoured on main)"
        type: boolean
        default: true

concurrency:
  # Pushes and dispatches are grouped by commit so two quick merges both build;
  # only superseded pull-request runs are cancelled.
  group: build-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_runners: ${{ steps.plan.outputs.has_runners }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUSH_INPUT: ${{ inputs.push }}
        run: |
          publish=false
          if [[ "$REF" == "refs/heads/main" ]]; then
            if [[ "$EVENT" == "push" ]]; then publish=true; fi
            if [[ "$EVENT" == "workflow_dispatch" && "$PUSH_INPUT" == "true" ]]; then publish=true; fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SELECT: ${{ inputs.runners }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              python3 ci/plan.py --base "$PR_BASE" --head "$PR_HEAD" ;;
            push)
              python3 ci/plan.py --base "$PUSH_BEFORE" --head "$GITHUB_SHA" ;;
            workflow_dispatch)
              python3 ci/plan.py --select "$SELECT" ;;
          esac

  build:
    needs: plan
    if: needs.plan.outputs.has_runners == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write      # sigstore signing of the provenance attestation
      attestations: write
    env:
      KEY: ${{ matrix.key }}
      IMAGE: ${{ matrix.image }}
      TAG: ${{ matrix.tag }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      HAL0_RUNNER_BUILD_DIR: ${{ github.workspace }}/../runner-build
    steps:
      - name: Free runner disk space
        if: matrix.heavy
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker system prune --all --force
          df -h /

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # runner.py tags from the last commit touching runners/<key>/

      # A hosted runner has 4 vCPUs and 16 GB. A ROCm + Vulkan llama.cpp build
      # ran out of memory (hipcc jobs, glslc fork) until swap was added and
      # overcommit allowed. CI runner only.
      - name: Add swap and allow overcommit
        if: matrix.heavy
        run: |
          sudo sysctl -w vm.overcommit_memory=1
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/hal0-swap
          sudo chmod 600 /mnt/hal0-swap
          sudo mkswap /mnt/hal0-swap
          sudo swapon /mnt/hal0-swap
          free -h

      - name: Recipe check
        run: python3 scripts/runner.py build "$KEY" --check

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are immutable. Only a definite "not found" counts as free; a
      # network or auth error must stop the job, never allow an overwrite.
      # A tag that exists means this exact recipe commit was already built.
      - name: Skip if the tag already exists
        id: exists
        if: env.PUBLISH == 'true'
        run: |
          set -uo pipefail
          if out="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" 2>&1)"; then
            echo "::notice::${IMAGE}:${TAG} already exists; tags are immutable, so this leg is skipped."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown|name unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN' <<<"$out"; then
            echo "${IMAGE}:${TAG} is free"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::cannot tell whether ${IMAGE}:${TAG} exists: ${out}"
            exit 1
          fi

      - name: Build
        if: steps.exists.outputs.exists != 'true'
        run: |
          set -euo pipefail
          jobs=$(( $(nproc) / 2 )); (( jobs >= 1 )) || jobs=1
          JOBS="$jobs" python3 scripts/runner.py build "$KEY" --tag "${IMAGE}:${TAG}"

      - name: Push
        id: push
        if: env.PUBLISH == 'true' && steps.exists.outputs.exists != 'true'
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${TAG}"
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:${TAG}" | grep "^${IMAGE}@" | head -n1 | cut -d@ -f2)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest after push: '${digest}'"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record candidate
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          python3 - <<'PY' > "candidate/${KEY}.json"
          import json, os
          e = os.environ
          print(json.dumps({
              "runner": e["KEY"], "image": e["IMAGE"], "tag": e["TAG"], "digest": e["DIGEST"],
              "commit": e["GITHUB_SHA"],
              "run": f'{e["GITHUB_SERVER_URL"]}/{e["GITHUB_REPOSITORY"]}/actions/runs/{e["GITHUB_RUN_ID"]}',
          }, indent=2))
          PY
          cat "candidate/${KEY}.json"

      - name: Upload candidate record
        if: steps.push.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.key }}
          path: candidate/${{ matrix.key }}.json
          retention-days: 90

  # One commit comment + job summary listing every candidate this run built.
  report:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true' && needs.build.result == 'success' && needs.plan.outputs.has_runners == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # commit comments
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true   # every leg may have been skipped (tags exist)
        with:
          pattern: candidate-*
          merge-multiple: true
          path: candidate

      - name: Post candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          compgen -G "candidate/*.json" >/dev/null || { echo "no new candidates"; exit 0; }
          python3 - <<'PY' > body.md
          import glob, json
          rows = [json.load(open(p)) for p in sorted(glob.glob("candidate/*.json"))]
          print("### Candidate runner images (not gated, not pinned)\n")
          print("| runner | tag | digest |\n|---|---|---|")
          for r in rows:
              print(f'| `{r["runner"]}` | `{r["tag"]}` | `{r["digest"]}` |')
          print("\nNothing consumes these yet. After the hardware gate passes, run the **Promote runner image** "
                "workflow with `runner=digest` pairs from this table and the gate report URL (docs/UPDATING.md). "
                "A llama.cpp bump promotes standard, cpu and cuda in one run.")
          PY
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F "body=@body.md"

  # The single check to require in branch protection.
  result:
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          [[ "$PLAN" == "success" ]] || { echo "plan: $PLAN"; exit 1; }
          [[ "$BUILD" == "success" || "$BUILD" == "skipped" ]] || { echo "build: $BUILD"; exit 1; }

# gates/standard.toml: the hardware gate for runners/standard (docs/UPDATING.md section 4).
#
# scripts/gate.py runs exactly this file against a published image@digest:
#   python3 scripts/gate.py standard --digest sha256:<digest>
# It lives outside runners/standard/ so that changing a probe never changes the
# image tag or rebuilds the image. Format: docs/RECIPES.md, "gates/<key>.toml".

#: The gate a build must pass on the Strix Halo box before hal0 pins its
#: digest. Every probe and session runs once per lane, one model at a time,
#: with the device and security flags of a hal0 slot.
#:
#: {path:KEY} names a model file in the operator's gate-models.toml (kept
#: outside this repository); the defaults are Qwen3.8-27B UD-Q4_K_XL with
#: mmproj-F16 and LFM2.5-2.6B Q8_0.
#:
#: Not gated: Qwen3.8-Flash-Next. hal0 ships it as unsupported; it needs
#: more than 115 GB of free unified memory to load.
boxes = ["the Strix Halo box (kfd present)"]

#: Every llama-server session passes --host 0.0.0.0, as hal0 does: llama-server
#: binds 127.0.0.1 by default, which inside the container is unreachable
#: through the published port. It is a session argument, not a lane
#: server_arg, because server_args also reach llama-perplexity.
[lanes.rocm]
devices = ["/dev/kfd", "/dev/dri"]
server_args = ["-dev", "ROCm0", "-ngl", "999"]

[lanes.vulkan]
devices = ["/dev/kfd", "/dev/dri"]
server_args = ["-dev", "Vulkan0", "-ngl", "999"]

[[probe]]
name = "version"
doc = "llama-server --version reports the llama.cpp release pinned in runners/llama.cpp.toml"
kind = "exec"
lanes = ["rocm"]
args = ["--version"]
#: llama.cpp prints "version: 0.6.0-dev (build 11552, commit 23b0202a1)" by
#: b11552; earlier releases printed "version: <build> (<commit>)".
expect = ["\\(build {version_digits}, commit "]

[[probe]]
name = "no-gpu-exit-78"
doc = "no devices mapped with -ngl 99 -> readable diagnostic, exit 78 (hal0 #1936)"
kind = "exec"
lanes = []
args = ["-ngl", "99", "-m", "/gate/models/absent.gguf"]
exit = 78
expect = ["no GPU devices are visible"]

[[probe]]
name = "doomed-model-exit-64"
doc = "a model file llama-server cannot load -> exit 64 (hal0 #2037)"
kind = "exec"
lanes = ["rocm"]
args = ["-m", "{garbage}"]
lane_args = true
exit = 64
expect = ["translating to exit 64"]

#: hal0's default slot for the default model: 96K context, in-file MTP head,
#: mmproj, ubatch smaller than batch, and no --port (the entrypoint passes
#: 8080 because upstream's default moved to 9931, #30159).
[[session]]
name = "qwen-mtp"
doc = "Qwen3.8-27B UD-Q4_K_XL + mmproj-F16 with MTP at hal0's defaults"
args = ["--host", "0.0.0.0", "-m", "{path:qwen3.8-27b}", "--mmproj", "{path:qwen3.8-27b-mmproj}", "-c", "98304",
        "--spec-type", "draft-mtp", "-b", "2048", "-ub", "512", "--jinja"]
port = 8080
mem_extra_gib = 10

  [[session.check]]
  name = "default-port"
  doc = "started with no --port, /health answers on 8080"
  kind = "http-json"
  no_port_arg = true

  [[session.check]]
  name = "paris"
  doc = "temp-0 'The capital of France is' -> 'Paris'; with -b 2048 -ub 512 it loads and serves"
  kind = "completion"
  prompt = "The capital of France is"
  expect = "Paris"

  [[session.check]]
  name = "structured-output"
  doc = "hal0's default reasoning settings (no --reasoning-format none): json_object and json_schema -> 200 with valid JSON, enable_thinking absent / true / false"
  kind = "structured"
  formats = ["json_object", "json_schema"]
  thinking = ["absent", "true", "false"]

  [[session.check]]
  name = "grammar-size"
  doc = "json_schema as large as a tool manifest plus one string with minLength 2500 -> 200 (patch 0001)"
  kind = "grammar-size"
  min_length = 2500

  [[session.check]]
  name = "tool-call"
  doc = "native tool_calls on Qwen3.8-27B"
  kind = "tool-call"

  [[session.check]]
  name = "large-tool-array"
  doc = "a tools array over 29k tokens with the target tool last; the model calls that tool with valid arguments"
  kind = "large-tools"
  min_prompt_tokens = 29000

  [[session.check]]
  name = "resident-memory"
  doc = "resident memory at the default context (96K) with MTP leaves the headroom for TTS/STT"
  kind = "resident-memory"

  [[session.check]]
  name = "mtp-on"
  doc = "MTP decode t/s and draft acceptance (records the 512-token temp-0 output)"
  kind = "mtp"
  role = "on"

[[session]]
name = "qwen-no-mtp"
doc = "the same model without MTP, for the comparison"
args = ["--host", "0.0.0.0", "-m", "{path:qwen3.8-27b}", "--mmproj", "{path:qwen3.8-27b-mmproj}", "-c", "98304",
        "-b", "2048", "-ub", "512", "--jinja"]
port = 8080
mem_extra_gib = 10

  [[session.check]]
  name = "mtp-off"
  doc = "decode t/s without MTP; whether the 512-token temp-0 output equals the MTP one (divergence on quantized models is upstream #25618)"
  kind = "mtp"
  role = "off"

[[session]]
name = "qwen-np4"
doc = "four server slots"
args = ["--host", "0.0.0.0", "-m", "{path:qwen3.8-27b}", "-c", "32768", "-np", "4", "--jinja"]
port = 8080
mem_extra_gib = 6

  [[session.check]]
  name = "concurrency"
  doc = "-np 4: four simultaneous temp-0 requests all complete and answer correctly; identity with the sequential answers is recorded"
  kind = "concurrency"
  parallel = 4

#: Speculative decoding with a separate drafter model (hal0 ADR-0031): the
#: DFlash2 drafter is a second GGUF, not a head inside the target. It runs
#: after qwen-no-mtp because the "mtp" check keeps one "on" record per lane and
#: qwen-no-mtp compares against the qwen-mtp record.
[[session]]
name = "qwen-dflash2"
doc = "Qwen3.8-27B UD-Q4_K_XL with the DFlash2 drafter (--spec-type draft-dflash)"
args = ["--host", "0.0.0.0", "-m", "{path:qwen3.8-27b}", "-c", "98304",
        "--spec-type", "draft-dflash", "--spec-draft-model", "{path:qwen3.8-27b-dflash2}",
        "--spec-draft-ngl", "all", "--spec-draft-n-max", "7", "--jinja"]
port = 8080
mem_extra_gib = 10

  #: Closest supported probe: gate.py has no JSON-path assertion (http-json
  #: reads top-level object keys; /slots is an array). The "mtp" check kind
  #: sends one temp-0 /completion and requires timings.draft_n > 0 and
  #: timings.draft_n_accepted > 0, which also proves speculation is active.
  [[session.check]]
  name = "dflash-speculative"
  doc = "a 64-token temp-0 completion reports draft_n > 0 and draft_n_accepted > 0, so the drafter is loaded and its tokens are accepted"
  kind = "mtp"
  role = "on"
  n_predict = 64

[[session]]
name = "qwen-reasoning-none"
doc = "--reasoning-format none (failed with 'Failed to initialize samplers' at b11510; hal0 #2545)"
args = ["--host", "0.0.0.0", "-m", "{path:qwen3.8-27b}", "-c", "16384", "--jinja", "--reasoning-format", "none"]
port = 8080
mem_extra_gib = 4
informational = true

  [[session.check]]
  name = "structured-reasoning-none"
  doc = "json_object and json_schema with --reasoning-format none; recorded, not a gate"
  kind = "structured"

[[session]]
name = "lfm"
doc = "LFM2.5-2.6B Q8_0"
args = ["--host", "0.0.0.0", "-m", "{path:lfm2.5-2.6b}", "-c", "16384", "--jinja"]
port = 8080
mem_extra_gib = 3

  [[session.check]]
  name = "lfm-structured-output"
  doc = "lfm2.5-2.6b Q8_0: response_format json_object and json_schema -> 200 (hal0 #2056)"
  kind = "structured"

[[session]]
name = "brain-sft"
doc = "hal0-brain-sft (minicpm5, plain GGUF)"
args = ["--host", "0.0.0.0", "-m", "{path:hal0-brain-sft}", "-c", "16384", "--jinja"]
port = 8080
mem_extra_gib = 3

  [[session.check]]
  name = "brain-sft-tool-call"
  doc = "hal0-brain-sft: native tool_calls"
  kind = "tool-call"

[[probe]]
name = "perplexity"
doc = "llama-perplexity on the same text, ROCm vs Vulkan, within 1%"
kind = "perplexity"
model = "lfm2.5-2.6b"
text = "perplexity-text"
compare = ["rocm", "vulkan"]
ctx = 512
chunks = 40
max_diff_pct = 1.0

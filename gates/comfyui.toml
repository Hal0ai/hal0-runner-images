# gates/comfyui.toml: the hardware gate for runners/comfyui (docs/UPDATING.md section 4).
#
# scripts/gate.py runs exactly this file against a published image@digest:
#   python3 scripts/gate.py comfyui --digest sha256:<digest>
# It lives outside runners/comfyui/ so that changing a probe never changes the
# image tag or rebuilds the image. Format: docs/RECIPES.md, "gates/<key>.toml".

#: Run by scripts/gate.py (docs/UPDATING.md section 4) on the Strix Halo box.
#: gate-models.toml: sdxl is an SDXL checkpoint (.safetensors), mounted
#: read-only into models/checkpoints. ComfyUI starts with hal0's launch flags.
boxes = ["the Strix Halo box (kfd present)"]

[lanes.rocm]
devices = ["/dev/kfd", "/dev/dri"]
podman_args = ["--ipc=host"]

[[probe]]
name = "pip-check"
doc = "pip check passes in the shipped image (the build runs it too)"
kind = "exec"
lanes = []
entrypoint = "/opt/venv/bin/python"
args = ["-m", "pip", "check"]

[[probe]]
name = "torch-rocm"
doc = "the venv's torch is a ROCm build (the build asserts it too)"
kind = "exec"
lanes = []
entrypoint = "/opt/venv/bin/python"
args = ["-c", "import torch; assert torch.version.hip, 'torch without ROCm'; print('torch', torch.__version__, 'hip', torch.version.hip)"]
expect = ["hip \\d"]

[[session]]
name = "comfyui"
doc = "ComfyUI with hal0's launch flags and one SDXL checkpoint"
args = ["bash", "-lc", "cd /opt/ComfyUI && exec python main.py --listen 0.0.0.0 --port 8188 --disable-mmap --bf16-vae --cache-none"]
port = 8188
health = "/system_stats"
mounts = [{ key = "sdxl", target = "/opt/ComfyUI/models/checkpoints/{basename}" }]
mem_extra_gib = 10
startup_timeout = 900

  [[session.check]]
  name = "gpu"
  doc = "the log shows AMD arch gfx1151, the full unified-memory VRAM pool (at least 64 GiB) and NORMAL_VRAM"
  kind = "log"
  expect = ["gfx1151", "NORMAL_VRAM"]
  at_least = [{ pattern = "Total VRAM (\\d+) MB", min = 65536 }]

  [[session.check]]
  name = "custom-nodes"
  doc = "the AMDGPUMonitor, essentials and GGUF custom nodes load"
  kind = "custom-nodes"
  names = ["ComfyUI-AMDGPUMonitor", "ComfyUI_essentials", "ComfyUI-GGUF"]

  [[session.check]]
  name = "sdxl-image"
  doc = "one SDXL image generation completes"
  kind = "comfy-generate"
  checkpoint = "sdxl"
  width = 1024
  height = 1024
  steps = 20

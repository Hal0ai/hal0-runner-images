# The one llama.cpp release every llama.cpp runner uses.
#
# runners/standard and runners/cpu build from this pin ([source].pin in their
# manifests). The external `cuda` entry in images.json follows it loosely:
# ggml-org does not publish a server-cuda image for every release, so cuda pins
# the newest ghcr.io/ggml-org/llama.cpp:server-cuda-b<N> with N <= version. The weekly release watch rewrites it
# when ggml-org publishes a newer bNNNNN release.

[llama_cpp]
repo = "https://github.com/ggml-org/llama.cpp.git"
#: Release b11840 (2026-10-23). Picked up since b11716: #30928 (Flint,
#: FlintForCausalLM), #30927/#30945/#30663 (qwen4exp DFlash layer inputs,
#: DFlash FC input scale, DFlash2 probabilistic drafts), #27196 (logprobs
#: with speculative decoding), #30666 (SWA checkpoint invalidation),
#: #30836 (HIP mmf reduction for tile widths not divisible by 64), #30861
#: (MoE down projection scaled per expert token). Gate risk items: #30856 and
#: #28554 (/v1/messages sampling params and slot id), #30863 (Responses SSE
#: output_index), #30819/#30929/#30941 (jinja filters and namespaces),
#: #30785/#30889 (vendored cpp-httplib 0.62.0 and BoringSSL). #28277 adds an
#: opt-in `--connect` p2p mode; hal0 never passes it.
version = "b11840"
ref = "36e36e63a54fc8f85b95e9c499a022b597e478dd"
ref_description = "release b11840: hexagon: add CEIL op (#31006)"

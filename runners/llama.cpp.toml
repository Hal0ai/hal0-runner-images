# The one llama.cpp release every llama.cpp runner uses.
#
# runners/standard and runners/cpu build from this pin ([source].pin in their
# manifests). The external `cuda` entry in images.json follows it loosely:
# ggml-org does not publish a server-cuda image for every release, so cuda pins
# the newest ghcr.io/ggml-org/llama.cpp:server-cuda-b<N> with N <= version. The weekly release watch rewrites it
# when ggml-org publishes a newer bNNNNN release.

[llama_cpp]
repo = "https://github.com/ggml-org/llama.cpp.git"
#: Release b12633 (2026-11-22). Picked up since b11840 (793 commits): LFM3
#: (LiquidAI LFM3-1.7B / LFM3-VL-2B, #31252, arch lfm3, needs >= b11946),
#: #31374 (end reasoning-budget forcing on the template's own end tag: fixes
#: LFM3 response_format 500 "Unexpected empty grammar stack", #31328),
#: #32016 (DFlash split into draft-dflash, draft-dflash2, draft-dspark and
#: draft-lilicorr; draft-dflash and draft-mtp keep their names), #30141 and
#: #31927 (MTP hidden state save/restore, hidden states read from a device
#: buffer), HIP and Vulkan work for gfx11/gfx12 (#32308 MMVQ ne11 gate tuned
#: for RDNA3.5, #31323 and #30280 Vulkan flash attention and split-K for
#: RDNA3/4, #31804 RDNA4 MMVQ, #32790 HIP NVFP4 scale fix). Gate risk items:
#: #32154 and #32434 (server slot scheduler refactor and its lora/recurrent
#: fix; slot reuse, prompt cache and parallel slots), #32356 (batch API
#: migrated to llama_batch_ext), #31153 and #29755 (grammar recursion limit,
#: GRAMMAR_RECURSIVE_LIMIT 256; deep tool schemas), #32098 (CORS origin
#: enforcement and DNS-rebinding protection: a request whose Origin does not
#: match --cors-origins is refused), #32113 (server tools, MCP servers or the
#: MCP proxy on a non-loopback --host without an API key are refused unless
#: --allow-unauthenticated-tools; hal0 passes --host 0.0.0.0 and none of
#: --tools, --mcp-servers-config or --webui-mcp-proxy by default, and the gate
#: sessions pass none of them), #32115 (media URLs and the MCP CORS
#: proxy refuse local and private addresses unless --media-allow-private-urls
#: or --ui-mcp-proxy-allow-private-urls; an image_url on the LAN now fails),
#: #31242 (--model or -hf is required: a server started with neither exits),
#: #30565 (llama : prune: drops the --defrag-thold option). Flag audit b11840..b12633 (every
#: quoted flag and LLAMA_ARG_ string in common/ and tools/): removed
#: --defrag-thold / -dt / LLAMA_ARG_DEFRAG_THOLD, which hal0 never passes;
#: added --allow-unauthenticated-tools, --media-allow-private-urls,
#: --models-memory-margin, --moe-cache-cpu-share, --ple (alias of the new
#: --shard), --tts-speaker-text, --tts-voice and --ui-mcp-proxy-allow-private-urls,
#: none passed by hal0. Every other flag hal0 passes is still present.
#: The grammar patch's context moved in this range (an added #include and the
#: new GRAMMAR_RECURSIVE_LIMIT line), so the patch was regenerated; it applies
#: to b12633 and not to b11840. MAX_REPETITION_THRESHOLD is still 2000
#: upstream at b12633, so drop_when is not met.
version = "b12651"
ref = "f5e6915c28f10330885fcb9243a93ae98d3115ab"
ref_description = "release b12651: webgpu : add ROLL support (#31887)"

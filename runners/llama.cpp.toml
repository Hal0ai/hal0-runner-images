# The one llama.cpp release every llama.cpp runner uses.
#
# runners/standard and runners/cpu build from this pin ([source].pin in their
# manifests). The external `cuda` entry in images.json follows it loosely:
# ggml-org does not publish a server-cuda image for every release, so cuda pins
# the newest ghcr.io/ggml-org/llama.cpp:server-cuda-b<N> with N <= version. The weekly release watch rewrites it
# when ggml-org publishes a newer bNNNNN release.

[llama_cpp]
repo = "https://github.com/ggml-org/llama.cpp.git"
#: Release b11552 (2026-10-10). Picked up since b11510: #30103 (HIP flash
#: attention race fix), #30257 (MTP together with mmproj), #30145 (Vulkan
#: rms_norm). Gate risk items: #30210 (chat API refactor touching tool calls,
#: grammar and reasoning-format) and #30159 (llama-server's default port is
#: now 9931; runners/standard's entrypoint always passes --port).
version = "b11596"
ref = "a17e94d229fc7fed1567a799baebd11b771fe5af"
ref_description = "release b11596: tests : consolidate context state tests into test-llama-context (#30023)"

# The one llama.cpp release every llama.cpp runner uses.
#
# runners/standard and runners/cpu build from this pin ([source].pin in their
# manifests). The external `cuda` entry in images.json follows it loosely:
# ggml-org does not publish a server-cuda image for every release, so cuda pins
# the newest ghcr.io/ggml-org/llama.cpp:server-cuda-b<N> with N <= version. The weekly release watch rewrites it
# when ggml-org publishes a newer bNNNNN release.

[llama_cpp]
repo = "https://github.com/ggml-org/llama.cpp.git"
#: Release b12119 (2026-11-04). Picked up since b11840: LFM3 (LiquidAI
#: LFM3-1.7B / LFM3-VL-2B, #31252, arch lfm3, needs >= b11946), #31374 (end
#: reasoning-budget forcing on the template's own end tag: fixes LFM3
#: response_format 500 "Unexpected empty grammar stack", #31328, which the
#: hal0 #2056 json_object probe would hit), #31598 (LFM3 layer inputs
#: recorded for spec decoding), #31608 (NVFP4 LFM3 GGUFs), #30141 (spec:
#: save and restore MTP hidden state), #31350 (server spec checkpoint restore
#: for long drafts), HIP gfx11/gfx12 fixes (#30885 bf16 WMMA operand type,
#: #30915 byte-permute fallback, #31255 conv2d unroll), Vulkan (#30656 src1
#: precision, #30106 small matmul tiles, #29882 rms norm via subgroup
#: reductions, #30146 small-n split-K on RDNA3/4, #31079 NVFP4 scale lookup
#: OOB, #31266 skipped-row zeroing), #31087 (no_alloc respected by every
#: memory cache), #31406 (KV rotation with shared-KV layers). Gate risk
#: items: #31153 and #29755 (grammar recursion limit,
#: GRAMMAR_RECURSIVE_LIMIT 256; deep tool schemas), #31081 (-sm tensor
#: refused for MoE amax-rescaling arches), #31632 (realtime server error
#: events). No flag hal0 passes was removed or renamed in b11840..b12063
#: (PR #50 audit); b12063..b12119 adds no flag removal either.
#: The grammar patch's context moved in this range (an added #include and the
#: new GRAMMAR_RECURSIVE_LIMIT line), so the patch was regenerated; it applies
#: to b12047, b12063 and b12119 and not to b11840. MAX_REPETITION_THRESHOLD
#: is still 2000 upstream at b12119, so drop_when is not met.
version = "b12119"
ref = "6f1e6543704bc5b080c7a98e7b6f707b31f6ed51"
ref_description = "release b12119: server : realtime: send an error event instead of crashing on exceptions (#31632)"

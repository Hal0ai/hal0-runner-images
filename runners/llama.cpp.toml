# The one llama.cpp release every llama.cpp runner uses.
#
# runners/standard and runners/cpu build from this pin ([source].pin in their
# manifests). The external `cuda` entry in images.json follows it loosely:
# ggml-org does not publish a server-cuda image for every release, so cuda pins
# the newest ghcr.io/ggml-org/llama.cpp:server-cuda-b<N> with N <= version. The weekly release watch rewrites it
# when ggml-org publishes a newer bNNNNN release.

[llama_cpp]
repo = "https://github.com/ggml-org/llama.cpp.git"
#: Release b12047 (2026-11-02). Picked up since b11840: HIP gfx11/gfx12 fixes
#: (#30885 bf16 WMMA operand type, #30915 byte-permute fallback, #31255 conv2d
#: unroll), Vulkan (#30656 src1 precision, #30106 small matmul tiles, #29882
#: rms norm via subgroup reductions), #31350 (server spec checkpoint restore
#: for long drafts), #31087 (no_alloc respected by every memory cache), #31406
#: (KV rotation with shared-KV layers). Gate risk items: #31153 and #29755
#: (grammar recursion limit, GRAMMAR_RECURSIVE_LIMIT 256; deep tool schemas),
#: #31081 (-sm tensor refused for MoE amax-rescaling arches). No flag hal0
#: passes was removed or renamed in b11840..b12063 (see the PR description).
#: The grammar patch's context moved in this range (an added #include and the
#: new GRAMMAR_RECURSIVE_LIMIT line), so the patch was regenerated; it applies
#: to b12047 and b12063 and not to b11840.
version = "b12047"
ref = "5e18eb021b021a133cfa4d9ac84dab644bc24318"
ref_description = "release b12047: sycl: dmmv code cleanup (#31325)"

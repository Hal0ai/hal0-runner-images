# The one llama.cpp release every llama.cpp runner uses.
#
# runners/standard and runners/cpu build from this pin ([source].pin in their
# manifests). The external `cuda` entry in images.json follows it loosely:
# ggml-org does not publish a server-cuda image for every release, so cuda pins
# the newest ghcr.io/ggml-org/llama.cpp:server-cuda-b<N> with N <= version. The weekly release watch rewrites it
# when ggml-org publishes a newer bNNNNN release.

[llama_cpp]
repo = "https://github.com/ggml-org/llama.cpp.git"
#: Release b12816 (2026-11-27). Picked up since b12633 (183 commits): #32497
#: (lazy grammar now also triggers on a bare JSON tool call), #29307 (token
#: aware chat parsing), #31564 (named tool_choice), #32908 (JSON schema
#: accepts boolean "value": true), #32828, #30997 and #28992 (server prompt
#: cache: an entry survives until its restore succeeds, a failed restore
#: retries after idle slots are cleared, skipped lookups fixed), #32398
#: (/models/sse in single-model mode), #30139 and #31669 (recurrent state read
#: in place, GDN replay instead of rollback), #31898 (reserving scratch memory in
#: graph_optimize), #33080 (SPLIT_MODE_TENSOR refused for Hadamard-folded
#: models), #32641 (gguf: no invalid enum values from untrusted file data),
#: #33073 and #32218 (DFlash2 and DSpark heads for Inkling 2; hal0 passes no
#: --spec-type for them), Vulkan #32721 (chunked GDN replay), #32162 (ssm_scan
#: state size 96), #33123 (Windows RDNA1 misclassification), HIP
#: (#32837 CDNA1 MMQ, #32805 Vega20 MMQ over MMVQ, #33086 bf16 MFMA
#: operand type for CDNA). Gate risk items: #30139 and #31669 (recurrent
#: and GDN state handling: re-run the MTP session and parallel slots),
#: #32828 and #30997 (prompt-cache restore order; re-run prompt reuse),
#: #32497 (tool-call grammar trigger), #32378 (CPU polling without OpenMP),
#: #32064 (MCP image/audio in tool results; only with --tools or the MCP
#: proxy, which hal0 does not pass). The b12633 gate risks still stand: #32154
#: and #32434 (server slot scheduler), #32356 (llama_batch_ext), #31153 and
#: #29755 (GRAMMAR_RECURSIVE_LIMIT 256), #32098 (CORS and DNS-rebinding
#: protection), #32113 (tools/MCP on a non-loopback --host need an API key
#: or --allow-unauthenticated-tools), #32115 (media URLs and the MCP proxy
#: refuse private addresses), #31242 (--model or -hf required). Flag audit
#: b12633..b12816 (every quoted flag and LLAMA_ARG_ string in common/ and
#: tools/server/): nothing removed or renamed; added --ui-agent
#: (LLAMA_ARG_UI_AGENT, takes no value), which hal0 does not pass. Every flag
#: hal0 passes is still present. The grammar patch applies unchanged to b12816
#: and MAX_REPETITION_THRESHOLD is still 2000 upstream, so drop_when is not
#: met.
version = "b12816"
ref = "7b74cb92d67384373e87512f4ffd2dbef756b944"
ref_description = "release b12816: graph : read recurrent states in place instead of copying (#28841) (#30139)"

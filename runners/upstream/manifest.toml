# CANONICAL HOME: Hal0ai/hal0-runner-images runners/upstream/ (moved from
# Hal0ai/hal0 packaging/runner/upstream/ @ d2e87915e; see docs/CONSOLIDATION.md).
# Edit the recipe HERE. [image] names the tag hal0 consumes today; a rebuild
# is a new image and only lands via a planned bump with a fresh hardware
# gate. CI builds push immutable tags under [ci].image; never push over the
# tag below.
#
# THE DEFAULT-RUNNER CANDIDATE (owner decision 2026-10-08, hal0-runner-images
# docs/CONSOLIDATION.md "Phase 3"). Pristine ggml-org llama.cpp at a tagged
# release, HIP + Vulkan in one image, on AMD's stable ROCm 10.0 packages for
# gfx1151. It replaces the fork-based default (../rocmfpx) once it passes the
# hardware gate with the new default model, unsloth/Qwen3.8-27B-GGUF.
#
# WHY UPSTREAM, NOT A FORK: the 2026-10-08 review of every fork hal0 has
# built from found the same shape each time — one maintainer, a squashed
# snapshot that stops merging upstream, and model support that arrives
# upstream first anyway (qwen35 MTP: May; qwen4exp: ggml-org #27941, Sep 1;
# qwen4exp NextN/MTP: #29761, Oct 1). Popularity, stability and
# maintainability were the stated priorities; upstream wins all three.
#
# WHY ROCm 10.0: repo.radeon.com stops at 7.2.4 for rhel10. AMD now ships
# ROCm 10.x as per-GPU packages (amdrocm-*10.0-gfx1151) on
# stable.repo.amd.com, which is a supported, versioned source — not a
# TheRock nightly. The only other builders on this hardware (kyuz0, ciru-ai)
# moved to 10.0 in September.
#
# WHAT IT DOES NOT DO: load ROCmFPX / ROCmI4 / IU4 quants. Those stay on
# ../rocmfpx, which is frozen (see its [lifecycle]) until the last slot
# using an FPX-format model has migrated.
#
# WHAT CHANGED IN THIS REVISION vs the :0829 pin still consumed below:
#   * source: ggml-org master c841aeeb (2026-08-29) -> release tag b11510
#   * base: strix-base ROCm 7.2.4 digest -> Fedora 44 + ROCm 10.0.0-4
#   * image definition: shared heredoc build.sh -> tracked Containerfile
#   * patches: none -> 0001 grammar repetition threshold (see [[patches]])
#   * cmake: -DGGML_RPC=OFF, -DLLAMA_BUILD_TESTS=OFF, Zen 5 ISA explicit,
#     LLAMA_BUILD_UI / LLAMA_USE_PREBUILT_UI (upstream's current names) OFF

[image]
#: What hal0 consumes TODAY (per-slot image_pin only). Unchanged by this
#: revision: the new build lands under [ci].image and moves here only in
#: the hal0 pin PR after the gate.
tag = "ghcr.io/hal0ai/hal0-combined-upstream:0829"

[base]
#: Not the strix base any more. Both FROMs are Fedora 44 by digest; the
#: ROCm toolchain comes from AMD's stable repo at an exact NEVR. The
#: `lineage` key is what scripts/test_repo_consistency.py keys on to skip
#: the "must FROM the strix base digest" rule the fork recipes keep.
lineage = "fedora44-rocm10"
image = "registry.fedoraproject.org/fedora-minimal:44"
digest = "sha256:1c7fa3a02fe2e75df3785978ae98a3f69440c3285337302b8072b042b529a5ab"
builder_image = "registry.fedoraproject.org/fedora:44"
builder_digest = "sha256:ba35579e107f26a4c2c000390fb3ff549f3858a9584a6b5a35f7fa51f54de309"
rocm_version = "10.0.0"
rocm_series = "10.0"
rocm_nevr = "10.0.0-4"
rocm_repo = "https://stable.repo.amd.com/rocm/core/packages/rhel10/x86_64"
rocm_gpg = "https://stable.repo.amd.com/rocm/gpg/packages.gpg"
#: Builder: amdrocm-core-devel10.0-gfx1151 (AMD's devel metapackage).
#: Runtime: amdrocm-runtime10.0 + amdrocm-blas10.0-gfx1151 only; see the
#: Containerfile for why not the amdrocm10.0-gfx1151 metapackage.
dnf_packages_pinned = true

[source]
#: Release tag b11510 (2026-10-08), the first tagged build after
#: qwen4exp NextN/MTP (#29761, 2026-10-01) that this recipe was written
#: against. Contains qwen35 (Qwen3.6/3.8 dense, in-file MTP head), qwen4exp
#: (Qwen3.8-Flash-Next) and `--spec-type draft-mtp` with `-md` sidecars.
repo = "https://github.com/ggml-org/llama.cpp.git"
ref = "c35b66744f13cb0dcc476af063e112122eee9355"
ref_description = "release b11510: CUDA : looped PAD kernel for more than 65535 rows or slices (#30147)"
submodules = false

[build]
gpu_arch = "gfx1151"
cmake_flags = [
    "-DCMAKE_BUILD_TYPE=Release",
    "-DGGML_HIP=ON",
    "-DGGML_HIP_ROCWMMA_FATTN=OFF",
    "-DGGML_HIP_FORCE_MMQ=ON",
    "-DGGML_VULKAN=ON",
    "-DGGML_CUDA=OFF",
    "-DGGML_RPC=OFF",
    "-DAMDGPU_TARGETS=gfx1151",
    "-DCMAKE_HIP_ARCHITECTURES=gfx1151",
    "-DGPU_TARGETS=gfx1151",
    "-DROCM_PATH=/opt/rocm",
    "-DHIP_PLATFORM=amd",
    # Explicit Zen 5 (Strix Halo CPU) ISA. Without GGML_NATIVE=OFF ggml
    # defaults to -march=native, i.e. whatever CPU compiles it; on a mixed
    # Intel/AMD GitHub runner that is the #2126 SIGILL class.
    "-DGGML_NATIVE=OFF",
    "-DGGML_AVX=ON",
    "-DGGML_AVX2=ON",
    "-DGGML_FMA=ON",
    "-DGGML_F16C=ON",
    "-DGGML_BMI2=ON",
    "-DGGML_AVX512=ON",
    "-DGGML_AVX512_VBMI=ON",
    "-DGGML_AVX512_VNNI=ON",
    "-DGGML_AVX512_BF16=ON",
    "-DLLAMA_BUILD_SERVER=ON",
    # Upstream renamed these from LLAMA_BUILD_WEBUI / LLAMA_USE_PREBUILT_WEBUI
    # (the spelling the fork recipes still use). At b11510 the old names are
    # only a deprecated alias (tools/ui/CMakeLists.txt forwards them), so a
    # later release can drop them silently. LLAMA_BUILD_UI defaults OFF;
    # LLAMA_USE_PREBUILT_UI defaults ON and fetches a UI bundle from Hugging
    # Face when the UI is built. Both off: the web UI is not used and the
    # build fetches nothing but the pinned source.
    # scripts/test_repo_consistency.py checks these names.
    "-DLLAMA_BUILD_UI=OFF",
    "-DLLAMA_USE_PREBUILT_UI=OFF",
    "-DLLAMA_BUILD_TESTS=OFF",
    "-DGGML_BUILD_TESTS=OFF",
    "-DLLAMA_BUILD_EXAMPLES=OFF",
]

#: One patch, carried from kyuz0's toolboxes. The other patch that lineage
#: carries (llama.cpp #25992 host-buffer workaround for integrated GPUs) is
#: a no-op at this ref: upstream forces `devices[id].integrated = false`
#: (ggml-cuda.cu, "Temporarily disabled ... #15034"), so the patched branch
#: never runs. Re-check both when the pin moves.
[[patches]]
file = "0001-grammar-repetition-threshold.patch"
why = "json_schema grammars compiled from large tool manifests exceed MAX_REPETITION_THRESHOLD=2000 and the request is rejected (kyuz0/amd-strix-halo-toolboxes#70)"
drop_when = "upstream raises the threshold or makes it a runtime option"

[verification]
#: What a build of this recipe must pass on the Strix Halo box before the
#: hal0 pin moves (docs/BUMPING.md step 5). Fill `result` in the bump PR.
boxes = ["the Strix Halo box (kfd present)"]
probes = [
    "unsloth/Qwen3.8-27B-GGUF UD-Q4_K_XL + mmproj-F16 loads on the ROCm lane AND the Vulkan lane; temp-0 'The capital of France is' -> 'Paris' on both",
    "MTP (--spec-type draft-mtp, in-file head) on vs off: decode t/s and draft acceptance, both lanes",
    "resident memory at the shipped default context; headroom for the brain slot + TTS/STT",
    "unsloth/Qwen3.8-Flash-Next-GGUF UD-Q4_K_XL + MTP/ sidecar (-md) loads (the large-model option)",
    "response_format json_schema from the hal0 tool manifest -> 200 (patch 0001)",
    # The brain family ran on runners/rocmfpx for its patches 0001/0002/0004.
    # At b11510 upstream has the minicpm5 pretokenizer (src/llama-vocab.cpp)
    # and its own LFM2 parser (common/parsers/lfm2.cpp); whether they cover
    # the hal0 #2056 think-block case is what these two probes decide. Pass =
    # the brain slot moves here too; fail = brain slots keep binary=rocmfpx.
    "lfm2.5-2.6b: response_format json_object AND json_schema -> 200, thinking kwarg absent/true/false (hal0 #2056)",
    "hal0-brain-sft minicpm5 (plain GGUF, not the rocmfpx quant): native tool_calls on both lanes",
    "zero devices mapped -> readable diagnostic, exit 78 (#1936); doomed model -> exit 64 (#2037)",
]

[lifecycle]
#: Why this runner exists and when it goes away (docs/BUMPING.md). Every
#: runner carries this table; scripts/test_repo_consistency.py enforces it.
#: track_ref is the branch on source.repo the weekly fork watch
#: (.github/workflows/fork-watch.yml) compares source.ref against.
purpose = "Default-runner candidate: pristine ggml-org llama.cpp at a tagged release, HIP + Vulkan, ROCm 10.0 stable packages. The yardstick every fork runner's retire_when is tested against."
needed_for = [
    "unsloth/Qwen3.8-27B-GGUF (qwen35, in-file MTP head, mmproj) — the new default model",
    "unsloth/Qwen3.8-Flash-Next-GGUF (qwen4exp + MTP sidecar) — the large-model option",
    "every plain-GGUF catalogue model (gpt-oss, Qwen3.5, Llama 3.2, Phi-3, LFM2.5)",
]
retire_when = "Never as a recipe: it is the yardstick. A given pin retires when the next tagged release passes the same gate."
track_ref = "refs/heads/master"

[ci]
#: Push target for CI builds (build-matrix.yml, `only=runners/upstream`). A new
#: hal0-runner-* package, never the consumed package named in [image]: CI
#: tags are immutable `<dir>-<ref[:7]>-r<commit[:7]>`.
image = "ghcr.io/hal0ai/hal0-runner-upstream"

# runners/standard — the default llama.cpp runner for AMD GPUs.
#
# Pristine ggml-org llama.cpp at a tagged release, HIP (ROCm) and Vulkan
# (RADV) in one image, built for gfx1151 (Strix Halo) on AMD's stable
# ROCm 10.0 packages. No fork, one patch (see [[patches]]).
#
# Build:   python3 scripts/runner.py build standard
# Check:   python3 scripts/runner.py build standard --check
# Bump:    docs/UPDATING.md
#
# Lineage: this recipe started as runners/upstream in PR #14, which passed
# the hardware gate at release b11510 (ROCm and Vulkan lanes; MTP decode
# about 28% faster than the old fork default on ROCm). This revision moves
# the pin to b11552; the gate in [verification] runs again on that build
# before hal0 pins it.

[runner]
key = "standard"
title = "Standard"
summary = "llama.cpp for AMD GPUs, ROCm or Vulkan, built from the official upstream release."
family = "llama-server"
backends = ["rocm", "vulkan"]
tier = "default"

[image]
package = "ghcr.io/hal0ai/hal0-runner-standard"
#: version = the llama.cpp release from runners/llama.cpp.toml. Tag =
#: <version>-r<sha7>, e.g. b11552-r1a2b3c4.

[source]
#: The llama.cpp repo, release and commit come from runners/llama.cpp.toml,
#: shared with runners/cpu, runners/standard and the external cuda entry.
pin = "llama.cpp.toml"
#: Clone on the host into the build context's src/ and apply patches there,
#: so `--check` needs no container runtime.
checkout = true

[build]
heavy = true
timeout_minutes = 360
gpu_arch = "gfx1151"
cmake_flags = [
    "-DCMAKE_BUILD_TYPE=Release",
    "-DGGML_HIP=ON",
    "-DGGML_HIP_ROCWMMA_FATTN=OFF",
    "-DGGML_HIP_FORCE_MMQ=ON",
    "-DGGML_VULKAN=ON",
    "-DGGML_CUDA=OFF",
    "-DGGML_RPC=OFF",
    "-DAMDGPU_TARGETS=gfx1151",
    "-DCMAKE_HIP_ARCHITECTURES=gfx1151",
    "-DGPU_TARGETS=gfx1151",
    "-DROCM_PATH=/opt/rocm",
    "-DHIP_PLATFORM=amd",
    # Explicit Zen 5 (Strix Halo CPU) ISA. Without GGML_NATIVE=OFF ggml uses
    # -march=native, i.e. whatever CPU compiled it; on a mixed Intel/AMD
    # GitHub runner that is the SIGILL class from hal0 #2126.
    "-DGGML_NATIVE=OFF",
    "-DGGML_AVX=ON",
    "-DGGML_AVX2=ON",
    "-DGGML_FMA=ON",
    "-DGGML_F16C=ON",
    "-DGGML_BMI2=ON",
    "-DGGML_AVX512=ON",
    "-DGGML_AVX512_VBMI=ON",
    "-DGGML_AVX512_VNNI=ON",
    "-DGGML_AVX512_BF16=ON",
    "-DLLAMA_BUILD_SERVER=ON",
    # Upstream's current names (LLAMA_BUILD_WEBUI / LLAMA_USE_PREBUILT_WEBUI
    # are deprecated aliases at b11552, tools/ui/CMakeLists.txt). Both off:
    # hal0 does not use the web UI and the build fetches nothing but the
    # pinned source.
    "-DLLAMA_BUILD_UI=OFF",
    "-DLLAMA_USE_PREBUILT_UI=OFF",
    "-DLLAMA_BUILD_TESTS=OFF",
    "-DGGML_BUILD_TESTS=OFF",
    "-DLLAMA_BUILD_EXAMPLES=OFF",
]

[build.args]
#: Both stages are Fedora 44, pinned by digest.
FEDORA_BUILDER = "registry.fedoraproject.org/fedora:44@sha256:ba35579e107f26a4c2c000390fb3ff549f3858a9584a6b5a35f7fa51f54de309"
FEDORA_RUNTIME = "registry.fedoraproject.org/fedora-minimal:44@sha256:1c7fa3a02fe2e75df3785978ae98a3f69440c3285337302b8072b042b529a5ab"
#: AMD ships ROCm 10.x as per-GPU packages on stable.repo.amd.com
#: (repo.radeon.com stops at 7.2.4 for rhel10). Packages are pinned to an
#: exact NEVR and their signatures are checked against this key.
ROCM_REPO = "https://stable.repo.amd.com/rocm/core/packages/rhel10/x86_64"
ROCM_GPG = "https://stable.repo.amd.com/rocm/gpg/packages.gpg"
ROCM_SERIES = "10.0"
ROCM_NEVR = "10.0.0-4"

#: One patch, from kyuz0's Strix Halo toolboxes. Still needed at b11552:
#: src/llama-grammar.cpp keeps MAX_REPETITION_THRESHOLD at 2000. kyuz0's
#: other patch (llama.cpp #25992 host-buffer workaround) is a no-op on
#: upstream and is not carried. Re-check both on every bump.
[[patches]]
file = "0001-grammar-repetition-threshold.patch"
why = "json_schema grammars compiled from large tool manifests exceed MAX_REPETITION_THRESHOLD=2000 and the request is rejected (kyuz0/amd-strix-halo-toolboxes#70)"
drop_when = "upstream raises the threshold or makes it a runtime option"

[verification]
#: The hardware gate a build must pass on the Strix Halo box before hal0
#: pins its digest (docs/UPDATING.md section 4). scripts/gate.py runs every
#: probe and session below, once per lane, one model at a time, with the
#: device and security flags of a hal0 slot:
#:
#:   python3 scripts/gate.py standard --digest sha256:<digest>
#:
#: {path:KEY} names a model file in the operator's gate-models.toml (kept
#: outside this repository); the defaults are Qwen3.8-27B UD-Q4_K_XL with
#: mmproj-F16 and LFM2.5-2.6B Q8_0.
#:
#: Not gated: Qwen3.8-Flash-Next. hal0 ships it as unsupported; it needs
#: more than 115 GB of free unified memory to load.
boxes = ["the Strix Halo box (kfd present)"]

[verification.lanes.rocm]
devices = ["/dev/kfd", "/dev/dri"]
server_args = ["-dev", "ROCm0", "-ngl", "999"]

[verification.lanes.vulkan]
devices = ["/dev/kfd", "/dev/dri"]
server_args = ["-dev", "Vulkan0", "-ngl", "999"]

[[verification.probe]]
name = "version"
doc = "llama-server --version reports the llama.cpp release pinned in runners/llama.cpp.toml"
kind = "exec"
lanes = ["rocm"]
args = ["--version"]
expect = ["version: {version_digits}\\b"]

[[verification.probe]]
name = "no-gpu-exit-78"
doc = "no devices mapped with -ngl 99 -> readable diagnostic, exit 78 (hal0 #1936)"
kind = "exec"
lanes = []
args = ["-ngl", "99", "-m", "/gate/models/absent.gguf"]
exit = 78
expect = ["no GPU devices are visible"]

[[verification.probe]]
name = "doomed-model-exit-64"
doc = "a model file llama-server cannot load -> exit 64 (hal0 #2037)"
kind = "exec"
lanes = ["rocm"]
args = ["-m", "{garbage}"]
lane_args = true
exit = 64
expect = ["translating to exit 64"]

#: hal0's default slot for the default model: 96K context, in-file MTP head,
#: mmproj, ubatch smaller than batch, and no --port (the entrypoint passes
#: 8080 because upstream's default moved to 9931, #30159).
[[verification.session]]
name = "qwen-mtp"
doc = "Qwen3.8-27B UD-Q4_K_XL + mmproj-F16 with MTP at hal0's defaults"
args = ["-m", "{path:qwen3.8-27b}", "--mmproj", "{path:qwen3.8-27b-mmproj}", "-c", "98304",
        "--spec-type", "draft-mtp", "-b", "2048", "-ub", "512", "--jinja"]
port = 8080
mem_extra_gib = 10

  [[verification.session.check]]
  name = "default-port"
  doc = "started with no --port, /health answers on 8080"
  kind = "http-json"
  no_port_arg = true

  [[verification.session.check]]
  name = "paris"
  doc = "temp-0 'The capital of France is' -> 'Paris'; with -b 2048 -ub 512 it loads and serves"
  kind = "completion"
  prompt = "The capital of France is"
  expect = "Paris"

  [[verification.session.check]]
  name = "structured-output"
  doc = "hal0's default reasoning settings (no --reasoning-format none): json_object and json_schema -> 200 with valid JSON, enable_thinking absent / true / false"
  kind = "structured"
  formats = ["json_object", "json_schema"]
  thinking = ["absent", "true", "false"]

  [[verification.session.check]]
  name = "grammar-size"
  doc = "json_schema as large as a tool manifest plus one string with minLength 2500 -> 200 (patch 0001)"
  kind = "grammar-size"
  min_length = 2500

  [[verification.session.check]]
  name = "tool-call"
  doc = "native tool_calls on Qwen3.8-27B"
  kind = "tool-call"

  [[verification.session.check]]
  name = "large-tool-array"
  doc = "a tools array over 29k tokens with the target tool last; the model calls that tool with valid arguments"
  kind = "large-tools"
  min_prompt_tokens = 29000

  [[verification.session.check]]
  name = "resident-memory"
  doc = "resident memory at the default context (96K) with MTP leaves the headroom for TTS/STT"
  kind = "resident-memory"

  [[verification.session.check]]
  name = "mtp-on"
  doc = "MTP decode t/s and draft acceptance (records the 512-token temp-0 output)"
  kind = "mtp"
  role = "on"

[[verification.session]]
name = "qwen-no-mtp"
doc = "the same model without MTP, for the comparison"
args = ["-m", "{path:qwen3.8-27b}", "--mmproj", "{path:qwen3.8-27b-mmproj}", "-c", "98304",
        "-b", "2048", "-ub", "512", "--jinja"]
port = 8080
mem_extra_gib = 10

  [[verification.session.check]]
  name = "mtp-off"
  doc = "decode t/s without MTP; whether the 512-token temp-0 output equals the MTP one (divergence on quantized models is upstream #25618)"
  kind = "mtp"
  role = "off"

[[verification.session]]
name = "qwen-np4"
doc = "four server slots"
args = ["-m", "{path:qwen3.8-27b}", "-c", "32768", "-np", "4", "--jinja"]
port = 8080
mem_extra_gib = 6

  [[verification.session.check]]
  name = "concurrency"
  doc = "-np 4: four simultaneous temp-0 requests all complete and answer correctly; identity with the sequential answers is recorded"
  kind = "concurrency"
  parallel = 4

[[verification.session]]
name = "qwen-reasoning-none"
doc = "--reasoning-format none (failed with 'Failed to initialize samplers' at b11510; hal0 #2545)"
args = ["-m", "{path:qwen3.8-27b}", "-c", "16384", "--jinja", "--reasoning-format", "none"]
port = 8080
mem_extra_gib = 4
informational = true

  [[verification.session.check]]
  name = "structured-reasoning-none"
  doc = "json_object and json_schema with --reasoning-format none; recorded, not a gate"
  kind = "structured"

[[verification.session]]
name = "lfm"
doc = "LFM2.5-2.6B Q8_0"
args = ["-m", "{path:lfm2.5-2.6b}", "-c", "16384", "--jinja"]
port = 8080
mem_extra_gib = 3

  [[verification.session.check]]
  name = "lfm-structured-output"
  doc = "lfm2.5-2.6b Q8_0: response_format json_object and json_schema -> 200 (hal0 #2056)"
  kind = "structured"

[[verification.session]]
name = "brain-sft"
doc = "hal0-brain-sft (minicpm5, plain GGUF)"
args = ["-m", "{path:hal0-brain-sft}", "-c", "16384", "--jinja"]
port = 8080
mem_extra_gib = 3

  [[verification.session.check]]
  name = "brain-sft-tool-call"
  doc = "hal0-brain-sft: native tool_calls"
  kind = "tool-call"

[[verification.probe]]
name = "perplexity"
doc = "llama-perplexity on the same text, ROCm vs Vulkan, within 1%"
kind = "perplexity"
model = "lfm2.5-2.6b"
text = "perplexity-text"
compare = ["rocm", "vulkan"]
ctx = 512
chunks = 40
max_diff_pct = 1.0

[lifecycle]
purpose = "The default GPU runner: official llama.cpp releases for AMD GPUs, ROCm and Vulkan in one image."
needed_for = [
    "unsloth/Qwen3.8-27B-GGUF (qwen35, in-file MTP head, mmproj), the default model",
    "every plain-GGUF catalogue model (gpt-oss, Qwen3.5, Llama 3.2, Phi-3, LFM2.5, MiniCPM5)",
]
retire_when = "Never as a recipe. Each pin is replaced when a newer release passes the same gate."

[lifecycle.track]
#: Watch ggml-org's numbered build releases (bNNNNN). Not /releases/latest:
#: that returns the separate semver line (v0.6.0 on 2026-10-11).
kind = "github-release"
pattern = "^b[0-9]+$"
#: ggml-org publishes every bNNNNN build as a GitHub prerelease.
include_prereleases = true

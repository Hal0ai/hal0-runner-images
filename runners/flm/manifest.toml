# runners/flm — FastFlowLM on the AMD XDNA 2 NPU.
#
# Builds XRT plus the xdna NPU plugin from amd/xdna-driver, then FastFlowLM,
# all from pinned commits, into an Ubuntu 24.04 runtime image.
#
# Build:   python3 scripts/runner.py build flm   (about 25 minutes)

[runner]
key = "flm"
title = "NPU (FastFlowLM)"
summary = "Runs supported models on the AMD XDNA 2 NPU, leaving the GPU free."
family = "flm"
backends = ["npu"]
tier = "default"

[image]
package = "ghcr.io/hal0ai/hal0-runner-flm"
version = "0.9.44"

[source]
#: FastFlowLM moved from FastFlowLM/FastFlowLM to ROCm/FastFlowLM; GitHub
#: redirects the old URL.
repo = "https://github.com/ROCm/FastFlowLM.git"
#: Release v0.9.44 (annotated tag b13bc516 -> commit 740aafbd).
ref = "740aafbdb5164a9f6d4753ced82695a76dbcdc5a"
release = "v0.9.44"

[build]
heavy = true
timeout_minutes = 120

[build.args]
UBUNTU = "docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55"
FLM_REPO = "https://github.com/ROCm/FastFlowLM.git"
FLM_REF = "740aafbdb5164a9f6d4753ced82695a76dbcdc5a"
#: xdna-driver tag 2.21.75 (the Ryzen AI 1.7.1 pairing; its xrt submodule
#: pins XRT 2.21.75), matching the host libxrt hal0 boxes run.
XDNA_REPO = "https://github.com/amd/xdna-driver.git"
XDNA_REF = "beb9e450fe123ecdf395453971576179cedcf1dd"
#: FastFlowLM's tokenizers-cpp needs rustc >= 1.85.
RUST_VERSION = "1.85.0"

[verification]
boxes = ["the Strix Halo box (NPU, amdxdna loaded)"]
probes = [
    "the build-time `xrt-smi --version` smoke passes (it is part of the Containerfile)",
    "`flm version` reports v0.9.44",
    "`flm validate` with /dev/accel passed through and memlock unlimited",
    "a hal0 flm slot serves /v1/models and one /v1/chat/completions request",
]

[lifecycle]
purpose = "Run small models on the NPU so the GPU stays free for the main model."
needed_for = ["FastFlowLM model tags served by hal0 flm slots"]
retire_when = "When hal0 drops NPU support."

[lifecycle.track]
kind = "github-release"
pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"

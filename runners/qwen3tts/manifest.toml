# runners/qwen3tts — Qwen3-TTS multilingual text-to-speech on the GPU (ROCm).
#
# A FastAPI server (qwen3tts_server.py, hal0's own code) around the qwen-tts
# package, on AMD's rocm/pytorch image. Same /v1/audio/speech contract as
# runners/kokoro, so it is a drop-in alternative voice.
#
# Build:   python3 scripts/runner.py build qwen3tts

[runner]
key = "qwen3tts"
title = "Qwen3 TTS"
summary = "Higher-quality multilingual text-to-speech on the GPU (ROCm). Opt-in; a large download (about 10 GB)."
family = "qwen3tts"
backends = ["rocm"]
tier = "optional"

[image]
package = "ghcr.io/hal0ai/hal0-runner-qwen3tts"
version = "0.1.1"

[source]
kind = "pypi"
package = "qwen-tts"
version = "0.1.1"
repo = "https://github.com/Qwen/Qwen3-TTS"

[build]
heavy = true
timeout_minutes = 90

[build.args]
#: rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.10.0, the
#: exact base layers of the image hal0 shipped.
ROCM_PYTORCH = "docker.io/rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.10.0@sha256:4449f856653602317e4101a76fce599c7fcd58ccec2e539951fce5f73083179e"

[verification]
#: Run by scripts/gate.py (docs/UPDATING.md section 4) on the Strix Halo box.
#: gate-models.toml: qwen3tts is the Qwen3-TTS-12Hz-1.7B-CustomVoice
#: directory. The server downloads its codec and tokenizer into /cache; give
#: a qwen3tts-cache directory to reuse one between runs (it is written to),
#: otherwise each run starts from an empty one.
boxes = ["the Strix Halo box (kfd present)"]

[verification.lanes.rocm]
devices = ["/dev/kfd", "/dev/dri"]

[[verification.probe]]
name = "pip-check"
doc = "pip check passes in the shipped image (the build runs it too)"
kind = "exec"
lanes = []
entrypoint = "python3"
args = ["-m", "pip", "check"]

[[verification.probe]]
name = "torch-rocm"
doc = "the image's torch is a ROCm build (the build asserts it too)"
kind = "exec"
lanes = []
entrypoint = "python3"
args = ["-c", "import torch; assert torch.version.hip, 'torch without ROCm'; print('torch', torch.__version__, 'hip', torch.version.hip)"]
expect = ["hip \\d"]

[[verification.session]]
name = "tts"
doc = "qwen3tts-server with Qwen3-TTS-12Hz-1.7B-CustomVoice mounted"
args = ["--model_path", "{path:qwen3tts}", "--host", "0.0.0.0", "--port", "8087"]
port = 8087
ready = { model_loaded = true }
cache = [{ key = "qwen3tts-cache", target = "/cache" }]
mem_extra_gib = 6
startup_timeout = 1800

  [[verification.session.check]]
  name = "loads-on-gpu"
  doc = "the server loads the model on the GPU and its warm-up synthesis succeeds"
  kind = "log"
  expect = ["device=cuda:0", "warmup ok"]

  [[verification.session.check]]
  name = "speech-english"
  doc = "POST /v1/audio/speech in English returns playable audio"
  kind = "speech"
  input = "Hello from the hal0 hardware gate. This sentence should be clearly audible."
  voice = "Ryan"
  language = "English"

  [[verification.session.check]]
  name = "speech-chinese"
  doc = "POST /v1/audio/speech in a second language returns playable audio"
  kind = "speech"
  input = "你好，这是 hal0 硬件门禁的语音测试。"
  voice = "Vivian"
  language = "Chinese"

[lifecycle]
purpose = "Optional higher-quality multilingual voice on the GPU."
needed_for = ["Qwen3-TTS-12Hz-1.7B-CustomVoice slots"]
retire_when = "When hal0 drops the Qwen3 TTS runtime."

[lifecycle.track]
kind = "pypi"

# runners/kokoro — Kokoro-82M text-to-speech on the CPU.
#
# A small FastAPI server (kokoro_server.py, hal0's own code) around the
# kokoro-onnx package. OpenAI-compatible /v1/audio/speech.
#
# Build:   python3 scripts/runner.py build kokoro

[runner]
key = "kokoro"
title = "Kokoro speech"
summary = "Text-to-speech on the CPU. Works on any box, no GPU needed."
family = "kokoro"
backends = ["cpu"]
tier = "default"

[image]
package = "ghcr.io/hal0ai/hal0-runner-kokoro"
version = "0.4.9"

[source]
kind = "pypi"
package = "kokoro-onnx"
version = "0.4.9"
repo = "https://github.com/thewh1teagle/kokoro-onnx"

[build]
heavy = false
timeout_minutes = 45

[build.args]
PYTHON = "docker.io/library/python:3.12.13-bookworm@sha256:3cd9086bdb30f7c9bc08a3fa621d9842e0d3f6f9291aeb4677e0547817c10b12"
PIP_VERSION = "26.1.1"

[verification]
#: Run by scripts/gate.py (docs/UPDATING.md section 4). The kokoro entry of
#: gate-models.toml is the directory holding kokoro-*.onnx and voices*.bin.
boxes = ["any x86_64 box"]

[verification.lanes.cpu]

[[verification.probe]]
name = "pip-check"
doc = "pip check passes in the shipped image (the build runs it too)"
kind = "exec"
lanes = []
entrypoint = "python3"
args = ["-m", "pip", "check"]

[[verification.session]]
name = "tts"
doc = "kokoro-server with the model mounted"
args = ["--model_path", "{path:kokoro}", "--host", "0.0.0.0", "--port", "8090"]
port = 8090
ready = { model_loaded = true }
mem_extra_gib = 2
startup_timeout = 300

  [[verification.session.check]]
  name = "health"
  doc = "/health returns 200 with model_loaded=true"
  kind = "http-json"
  equals = { model_loaded = true }

  [[verification.session.check]]
  name = "voices"
  doc = "/v1/audio/voices lists the voices"
  kind = "http-json"
  path = "/v1/audio/voices"
  nonempty = ["voices"]

  [[verification.session.check]]
  name = "speech"
  doc = "POST /v1/audio/speech with the default voice returns playable audio"
  kind = "speech"
  input = "Hello from the hal0 hardware gate. This sentence should be clearly audible."

[lifecycle]
purpose = "Default text-to-speech: light enough for the CPU on any box."
needed_for = ["hal0 TTS slots (Kokoro-82M ONNX)"]
retire_when = "When hal0 replaces Kokoro as its default CPU voice."

[lifecycle.track]
kind = "pypi"
